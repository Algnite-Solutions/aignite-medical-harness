[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ama"
version = "0.1.0"
description = "ama — aigne-medical-agent: minimal research runner (Episode → Turn → Evidence → Decision)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ama = "ama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: real-API integration test (opt-in: RUN_API_TESTS=1 plus provider key env; never run by default)",
]
