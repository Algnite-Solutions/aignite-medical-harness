[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ama"
version = "0.1.0"
description = "ama — aigne-medical-agent: minimal research runner (Episode → Turn → Evidence → Decision)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10", "pyarrow>=17"]
mimic-cxr = ["Pillow>=10"]
pathvqa = ["pyarrow>=17", "Pillow>=10"]

[project.scripts]
ama = "ama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ama*"]

[tool.setuptools.package-data]
"ama._vendor.automedbench_report" = ["LICENSE", "SOURCE.json"]
"ama.importers" = ["pathvqa-source.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: real-API integration test (opt-in: RUN_API_TESTS=1 plus provider key env; never run by default)",
]
